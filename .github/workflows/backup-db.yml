# Backup diário do banco (Supabase).
#
# Por quê: o plano gratuito do Supabase não garante backup, e o banco guarda
# coisas que não existem em nenhum outro lugar (usuários e a ligação com a Steam;
# a partir do diário, as notas). Este fluxo exporta o banco todo dia e guarda
# as cópias FORA do Supabase, como artefatos do GitHub Actions, por 30 dias.
#
# O repositório é público e o backup inclui o schema `auth` (usuários e
# sessões). Por isso o arquivo é CRIPTOGRAFADO antes de sair da máquina do
# fluxo: sem a senha (BACKUP_PASSPHRASE) o artefato não serve para nada.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    endereço de conexão do "Session pooler" (porta 5432),
#                      com a senha do banco. O endereço "Direct connection" é
#                      só IPv6 e não funciona nas máquinas do GitHub.
#   BACKUP_PASSPHRASE  senha para abrir o backup. Guarde no gerenciador de
#                      senhas: sem ela o backup é irrecuperável.
#
# Como restaurar: README, seção "Como voltar uma versão".
name: Backup do banco

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 04:00 em Brasília
  workflow_dispatch: # botão "Run workflow", para testar ou fazer um backup na hora

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir os segredos
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltam os segredos SUPABASE_DB_URL e/ou BACKUP_PASSPHRASE."
            exit 1
          fi

      # Versão fixa: as opções do `db dump` já mudaram entre versões da CLI.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Exportar o banco
        run: |
          set -euo pipefail
          mkdir backup
          # Papéis, estrutura e dados, como no guia de backup do Supabase.
          supabase db dump --remote="$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --remote="$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql

      # Um backup vazio que "deu certo" é pior que um erro: confere o conteúdo.
      - name: Conferir o que foi exportado
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."profiles"' backup/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."players"' backup/schema.sql
          grep -q '^COPY "public"."players"' backup/data.sql
          grep -q '^COPY "auth"."users"' backup/data.sql
          ls -l backup

      - name: Compactar e criptografar
        run: |
          set -euo pipefail
          name="dota-own-coach-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" backup
          # AES-256 com senha; a senha entra por um descritor, nunca na linha de comando.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o "$name.tar.gz.gpg" "$name.tar.gz" 3<<<"$BACKUP_PASSPHRASE"
          # Prova que o arquivo abre com a senha antes de guardá-lo.
          gpg --batch --quiet --decrypt --passphrase-fd 3 "$name.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE" \
            | tar -tzf - > /dev/null
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 30 # as cópias mais antigas somem sozinhas
          if-no-files-found: error
          compression-level: 0 # já está compactado
